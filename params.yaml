data:
  target: quality

experiment:
  name: wine-quality-regression

models:
  linear_regression:
    - name: lr_v1
      fit_intercept: true
      positive: false

    - name: lr_v2
      fit_intercept: false
      positive: false

    - name: lr_v3
      fit_intercept: true
      positive: true

  random_forest:
    - name: rf_v1
      n_estimators: 100
      max_depth: 5
      min_samples_split: 2

    - name: rf_v2
      n_estimators: 200
      max_depth: 10
      min_samples_split: 2

    - name: rf_v3
      n_estimators: 300
      max_depth: 15
      min_samples_split: 5

  xgboost:
    - name: xgb_v1
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.1

    - name: xgb_v2
      n_estimators: 200
      max_depth: 5
      learning_rate: 0.05

    - name: xgb_v3
      n_estimators: 300
      max_depth: 7
      learning_rate: 0.03